<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Gaucho Animado – AGENTINOS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080B14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 80px;
      font-family: sans-serif;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .label { color: #6B7280; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .name  { color: #fff; font-size: 16px; font-weight: 700; }
    .sub   { color: #DC2626; font-size: 12px; }

    /* ── Wrap ── */
    .char-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Imagen ── */
    .char-img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      transform-origin: bottom center;
      animation: pngFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 14px 20px rgba(0,0,0,0.5));
    }

    .char-img.active {
      animation: pngFloatFast 1.5s ease-in-out infinite;
    }

    @keyframes pngFloat {
      0%,100% {
        transform: translateY(0px) rotate(-0.5deg);
        filter: drop-shadow(0 14px 20px rgba(0,0,0,0.5));
      }
      25% { transform: translateY(-4px) rotate(0.3deg); }
      50% {
        transform: translateY(-12px) rotate(0.8deg);
        filter: drop-shadow(0 24px 32px rgba(0,0,0,0.25));
      }
      75% { transform: translateY(-5px) rotate(0.2deg); }
    }

    @keyframes pngFloatFast {
      0%,100% {
        transform: translateY(0px) rotate(-0.8deg);
        filter: drop-shadow(0 14px 20px rgba(0,0,0,0.5));
      }
      25% { transform: translateY(-5px) rotate(0.5deg); }
      50% {
        transform: translateY(-14px) rotate(1deg);
        filter: drop-shadow(0 26px 34px rgba(0,0,0,0.2));
      }
      75% { transform: translateY(-6px) rotate(0.3deg); }
    }

    /* ── Sombra dinámica ── */
    .char-shadow {
      width: 80px;
      height: 12px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.45) 0%, transparent 70%);
      border-radius: 50%;
      margin-top: -6px;
      animation: shadowAnim 3s ease-in-out infinite;
    }
    .char-shadow.active {
      animation: shadowAnimFast 1.5s ease-in-out infinite;
    }

    @keyframes shadowAnim {
      0%,100% { transform: scaleX(1);   opacity: 0.7; }
      50%      { transform: scaleX(0.55); opacity: 0.25; }
    }
    @keyframes shadowAnimFast {
      0%,100% { transform: scaleX(1);   opacity: 0.7; }
      50%      { transform: scaleX(0.5); opacity: 0.2; }
    }

    /* ── Dot de estado ── */
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .online  { background: #10B981; box-shadow: 0 0 6px #10B981; }
    .offline { background: #6B7280; }

    /* ── Glass card ── */
    .glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }
    .glass.active-card {
      border-color: rgba(220,38,38,0.4);
      box-shadow: 0 0 30px rgba(220,38,38,0.1);
    }
  </style>
</head>
<body>

  <!-- OFFLINE / idle -->
  <div class="card">
    <div class="label">Inactivo</div>
    <div class="glass">
      <div class="char-wrap">
        <img src="gaucho.png" class="char-img" alt="El Gaucho"/>
        <div class="char-shadow"></div>
      </div>
      <div class="name">El Gaucho</div>
      <div class="sub"><span class="status-dot offline"></span>Offline</div>
    </div>
  </div>

  <!-- ONLINE / active -->
  <div class="card">
    <div class="label">Activo</div>
    <div class="glass active-card">
      <div class="char-wrap">
        <img src="gaucho.png" class="char-img active" alt="El Gaucho"/>
        <div class="char-shadow active"></div>
      </div>
      <div class="name">El Gaucho</div>
      <div class="sub"><span class="status-dot online"></span>Online</div>
    </div>
  </div>

</body>
</html>
